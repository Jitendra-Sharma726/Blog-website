{% extends "base.html" %}

{% block content %}
<h2>Login</h2>
<form method="POST" action="{{ url_for('login') }}"> 
    {{ form.hidden_tag() }}
    <div>
        {{ form.username.label }}<br>
        {{ form.username(size=30) }}<br>
    </div>
    <div>
        {{ form.password.label }}<br>
        {{ form.password(size=30) }}<br>
    </div>
    <div>
        {{ form.submit() }}
    </div>
</form>
<p>Need an account? <a href="{{ url_for('register') }}">Register here</a></p>
{% endblock %}
