{% extends "base.html" %}

{% block content %}
<h2>Register</h2>
<form method="POST" action="{{ url_for('register') }}">
    {{ form.hidden_tag() }}
    <div>
      {{ form.username.label }}<br>
      {{ form.username(size=30) }}<br>
    </div>
    <div>
      {{ form.password.label }}<br>
      {{ form.password(size=30) }}<br>
    </div>
    <div>
      {{ form.submit() }}
    </div>
</form>
<p>Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
{% endblock %}
